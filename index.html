<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevaLink - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef5f3;color:#173b36}
header{background:#075e54;color:white;padding:22px;text-align:center}
.logo{font-size:30px;font-weight:bold}
.hero{text-align:center;padding:35px 15px}
.hero h1{font-size:32px;color:#075e54}
.hero p{color:#62736f}
.container{max-width:420px;margin:10px auto 35px;background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #ccd9d5}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tabs button{width:50%;padding:12px;border:0;border-radius:9px;background:#e5efec;color:#075e54;font-weight:bold}
.tabs button.active{background:#075e54;color:white}
input,select{width:100%;padding:14px;margin:9px 0;border:1px solid #ccd9d5;border-radius:9px;font-size:15px}
.mainbtn{width:100%;padding:14px;background:#075e54;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;margin-top:12px}
.note{text-align:center;font-size:12px;color:#7a8884}
footer{text-align:center;background:#073d38;color:white;padding:20px}
</style>
</head>
<body>
<header>
<div class="logo">🙏 SevaLink</div>
<p>Connect People • Help People</p>
</header>

<div class="hero">
<h1>Welcome to SevaLink</h1>
<p>Your Local Services Marketplace</p>
</div>

<div class="container">
<div class="tabs">
<button class="active" onclick="showForm('login',this)">Login</button>
<button onclick="showForm('signup',this)">Sign Up</button>
</div>

<form id="login" onsubmit="demo(event,'Login')">
<h2>Welcome Back!</h2>
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button class="mainbtn">Login</button>
</form>

<form id="signup" style="display:none" onsubmit="demo(event,'Sign Up')">
<h2>Create Account</h2>
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Create Password" required>
<select required>
<option value="">Select Account Type</option>
<option>Customer</option>
<option>Service Provider</option>
<option>Volunteer</option>
</select>
<button class="mainbtn">Create Account</button>
</form>
<p class="note">Demo design only. Real account login is not connected yet.</p>
</div>

<footer>
<h3>🙏 SevaLink</h3>
<p>Connect People • Help People</p>
<p>© 2026 SevaLink</p>
</footer>

<script>
function showForm(id,btn){
document.getElementById('login').style.display=id==='login'?'block':'none';
document.getElementById('signup').style.display=id==='signup'?'block':'none';
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}
function demo(e,name){
e.preventDefault();
alert(name+' demo form is working! Real account system is not connected yet.');
}
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL='https://gtqpybetecvcozbsjnsl.supabase.co'YAHAN_PROJECT_URL_DALO';
const SUPABASE_KEY =sb_publishable_aXeYcDdIVsRPCz8V1YKSpg_hNDDl8uo'YAHAN_PUBLISHABLE_KEY_DALO';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

window.sevaLinkSignup = async function(email, password) {
  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });
  if (error) return alert(error.message);
  alert('Sign Up request successful! Email confirmation may be required.');
};

window.sevaLinkLogin = async function(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });
  if (error) return alert(error.message);
  alert('Login successful!');
};
</script>
</body>
</html>
