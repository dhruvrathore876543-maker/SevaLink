
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevaLink - Local Services</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef5f3;color:#18332e}
header{background:#075e54;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:#064b43;padding:12px}
button{border:0;border-radius:8px;padding:12px 16px;background:#087e70;color:white;font-weight:bold;cursor:pointer}
nav button{background:white;color:#075e54}
main{max-width:950px;margin:auto;padding:18px}
h2{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px}
.service{background:white;border-radius:12px;padding:20px 10px;text-align:center;box-shadow:0 2px 8px #0001;cursor:pointer;border:1px solid #d9e8e3}
.service h3{margin:8px 0}
.service span{font-size:32px}
.card{background:white;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
.option{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #bdcfca;border-radius:8px;font-size:16px}
form{max-width:550px;margin:auto}
.hidden{display:none}
footer{text-align:center;background:#075e54;color:white;padding:18px;margin-top:30px}
.back{background:#555;margin-bottom:15px}
</style>
</head>
<body>

<header>
<h1>SevaLink</h1>
<p>आपकी स्थानीय सेवाएँ, आपके पास</p>
</header>

<nav>
<button onclick="home()">Home</button>
<button onclick="showLogin()">Login / Sign Up</button>
<button onclick="showContact()">Contact Us</button>
</nav>

<main>
<section id="home">
<h2>हमारी 12 Services</h2>
<div class="grid" id="services"></div>
</section>

<section id="details" class="hidden">
<button class="back" onclick="home()">← वापस जाएँ</button>
<h2 id="serviceTitle"></h2>
<p style="text-align:center">अपनी जरूरत की सेवा चुनें</p>
<div id="options"></div>
</section>

<section id="booking" class="hidden">
<button class="back" onclick="showDetails()">← वापस जाएँ</button>
<h2>Book Your Service</h2>
<div class="card">
<form id="bookingForm">
<label>आपका नाम</label>
<input id="customer" required placeholder="अपना नाम लिखें">
<label>मोबाइल नंबर</label>
<input id="phone" required type="tel" pattern="[0-9]{10}" placeholder="10 अंकों का नंबर">
<label>सेवा</label>
<input id="selectedService" readonly>
<label>आपका पता</label>
<textarea id="address" required placeholder="पूरा पता लिखें"></textarea>
<label>अतिरिक्त जानकारी</label>
<textarea id="notes" placeholder="जरूरत की जानकारी"></textarea>
<button type="submit" style="width:100%">Booking Request भेजें</button>
</form>
<p id="bookingMessage"></p>
</div>
</section>

<section id="login" class="hidden">
<button class="back" onclick="home()">← वापस जाएँ</button>
<h2>Login / Sign Up</h2>
<div class="card">
<form onsubmit="demoLogin(event)">
<input required type="email" placeholder="Email Address">
<input required type="password" placeholder="Password">
<select><option>Customer</option><option>Service Provider</option></select>
<button style="width:100%">Continue</button>
<p id="loginMessage"></p>
</form>
</div>
</section>

<section id="contact" class="hidden">
<button class="back" onclick="home()">← वापस जाएँ</button>
<h2>Contact Us</h2>
<div class="card">
<p>SevaLink - Local Services Marketplace</p>
<p>अपनी समस्या या सुझाव हमें भेजें।</p>
<form onsubmit="event.preventDefault();alert('Demo: आपका संदेश तैयार है।')">
<input required placeholder="आपका नाम">
<input required type="email" placeholder="Email">
<textarea required placeholder="अपना संदेश लिखें"></textarea>
<button style="width:100%">Send Message</button>
</form>
</div>
</section>
</main>

<footer>© 2026 SevaLink | Local Services Marketplace</footer>

<script>
const data=[
{name:"JCB",icon:"🚜",items:["खुदाई","लोडिंग","जमीन समतल करना","किराये पर JCB"]},
{name:"Tractor",icon:"🚜",items:["खेत की जुताई","ट्रॉली सेवा","सामान ढुलाई","किराये पर ट्रैक्टर"]},
{name:"Crane",icon:"🏗️",items:["मशीन उठाना","भारी सामान उठाना","वाहन उठाना","किराये पर क्रेन"]},
{name:"Plumber",icon:"🔧",items:["पाइप मरम्मत","नल लगाना","पानी की टंकी मरम्मत","लीकेज ठीक करना"]},
{name:"Electrician",icon:"💡",items:["वायरिंग","पंखा लगाना","लाइट लगाना","बिजली मरम्मत"]},
{name:"Mechanic",icon:"🔩",items:["बाइक मरम्मत","कार मरम्मत","ट्रैक्टर मरम्मत","अन्य वाहन"]},
{name:"Cleaning",icon:"🧹",items:["घर की सफाई","ऑफिस सफाई","टंकी सफाई","दुकान सफाई"]},
{name:"Home Tutor",icon:"📚",items:["गणित","विज्ञान","अंग्रेजी","सभी विषय"]},
{name:"Jobs",icon:"💼",items:["प्राइवेट नौकरी","पार्ट टाइम","फुल टाइम","स्थानीय नौकरी"]},
{name:"Ambulance",icon:"🚑",items:["सामान्य एम्बुलेंस","अस्पताल ट्रांसफर","मरीज परिवहन","अन्य सहायता"]},
{name:"Blood Donor",icon:"🩸",items:["ब्लड ग्रुप खोजें","डोनर खोजें","अस्पताल अनुरोध","डोनर रजिस्ट्रेशन"]},
{name:"Volunteer Help",icon:"🤝",items:["बुजुर्ग सहायता","सामान की सहायता","स्थानीय मदद","अन्य सहायता"]}
];

let current=0;
let selected="";

function hideAll(){
["home","details","booking","login","contact"].forEach(id=>
document.getElementById(id).classList.add("hidden"));
}
function home(){
hideAll();
document.getElementById("home").classList.remove("hidden");
}
function showDetails(){
hideAll();
document.getElementById("details").classList.remove("hidden");
}
function openService(i){
current=i;
hideAll();
document.getElementById("details").classList.remove("hidden");
document.getElementById("serviceTitle").textContent=data[i].name+" Services";
document.getElementById("options").innerHTML=data[i].items.map((item,j)=>`
<div class="card option">
<strong>${j+1}. ${item}</strong>
<button onclick="book('${item.replace(/'/g,"")}')">Book Now</button>
</div>`).join("");
}
function book(item){
selected=item;
hideAll();
document.getElementById("booking").classList.remove("hidden");
document.getElementById("selectedService").value=data[current].name+" - "+item;
}
function showLogin(){
hideAll();
document.getElementById("login").classList.remove("hidden");
}
function showContact(){
hideAll();
document.getElementById("contact").classList.remove("hidden");
}
function demoLogin(e){
e.preventDefault();
document.getElementById("loginMessage").textContent="Demo Login: असली अकाउंट सिस्टम अभी कनेक्ट नहीं है।";
}
document.getElementById("bookingForm").addEventListener("submit",function(e){
e.preventDefault();
const request={
name:document.getElementById("customer").value,
phone:document.getElementById("phone").value,
service:document.getElementById("selectedService").value,
address:document.getElementById("address").value,
notes:document.getElementById("notes").value
};
let list=JSON.parse(localStorage.getItem("sevalinkBookings")||"[]");
list.push(request);
localStorage.setItem("sevalinkBookings",JSON.stringify(list));
document.getElementById("bookingMessage").textContent="Demo Booking सेव हो गई है। अभी Provider तक नहीं पहुँची है।";
this.reset();
});
document.getElementById("services").innerHTML=data.map((s,i)=>`
<div class="service" onclick="openService(${i})">
<span>${s.icon}</span>
<h3>${s.name}</h3>
<p>4 Services देखें</p>
</div>`).join("");
home();
</script>
</body>
</html>
